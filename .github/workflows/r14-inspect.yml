name: R14 Inspect Generated Wiring

on:
  workflow_dispatch:
  push:
    branches: [codex/affectionate-companion-r14]
    paths:
      - .github/workflows/r14-inspect.yml
      - scripts/r14_wire.py
      - scripts/r14_preflight.py

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/affectionate-companion-r14
      - shell: pwsh
        run: python scripts/r14_wire.py
      - shell: pwsh
        run: python scripts/r14_preflight.py
      - name: Print generated AudioManager
        shell: pwsh
        run: |
          $lines = Get-Content app/src/main.rs
          $start = ($lines | Select-String '^struct AudioManager \{' | Select-Object -First 1).LineNumber
          $end = ($lines | Select-String '^fn spawn_audio_owner_worker' | Select-Object -First 1).LineNumber
          if (-not $start) { throw 'AudioManager start not found' }
          if (-not $end) { $end = [Math]::Min($start + 500, $lines.Count) }
          for ($i = $start - 1; $i -lt [Math]::Min($end, $lines.Count); $i++) {
            '{0:D5}: {1}' -f ($i + 1), $lines[$i]
          }
