name: cross-platform

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        run: ./scripts/test_headless.ps1
      - shell: pwsh
        run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Pet2-windows-x64
          path: dist/Pet2-windows-x64.zip

  macos-arm64:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - run: bash ./scripts/build_macos.sh
      - run: bash ./scripts/test_headless.sh
      - run: bash ./scripts/package_macos.sh
        env:
          PET2_ALLOW_ADHOC_SIGNING: "1"
      - run: |
          package_dir="$(mktemp -d)"
          ditto -x -k dist/Pet2-macos-arm64.zip "$package_dir"
          payload="$package_dir/Pet2-macos-arm64"
          test -x "$payload/Pet2.app/Contents/MacOS/Pet2"
          test -x "$payload/Pet2 Dev Console.app/Contents/MacOS/Pet2DevConsole"
          test -x "$payload/Pet2 Dev Console.app/Contents/Resources/DevConsole"
          test -x "$payload/tools/HabitatLab"
          test -x "$payload/tools/VoiceLab"
          codesign --verify --deep --strict "$payload/Pet2.app"
          codesign --verify --deep --strict "$payload/Pet2 Dev Console.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Pet2-macos-arm64
          path: dist/Pet2-macos-arm64.zip
