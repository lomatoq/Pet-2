name: cross-platform

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-vita-runtime:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/pet2-vita-embodied-iteration' &&
      !contains(github.event.head_commit.message, '[vita-materialized-b]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pet2-vita-embodied-iteration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Materialize VITA runtime integration
        shell: pwsh
        run: python .github/scripts/materialize_vita_stage_b.py
      - name: Format and validate integrated runtime
        shell: pwsh
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit only validated runtime files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            Cargo.lock `
            app/Cargo.toml `
            app/src/main.rs `
            app/src/vita_runtime.rs `
            crates/desktop_host/src/storage.rs `
            crates/lifecore/src/vita.rs
          if (git diff --cached --quiet) {
            exit 0
          }
          git commit -m "feat: integrate VITA into desktop runtime and persistence [vita-materialized-b]"
          git push origin HEAD:codex/pet2-vita-embodied-iteration

  windows-x64:
    needs: materialize-vita-runtime
    if: >-
      always() &&
      (needs.materialize-vita-runtime.result == 'success' ||
       needs.materialize-vita-runtime.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pet2-vita-embodied-iteration
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        run: ./scripts/test_headless.ps1
      - shell: pwsh
        run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Pet2-windows-x64
          path: dist/Pet2-windows-x64.zip

  macos-arm64:
    needs: materialize-vita-runtime
    if: >-
      always() &&
      (needs.materialize-vita-runtime.result == 'success' ||
       needs.materialize-vita-runtime.result == 'skipped')
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pet2-vita-embodied-iteration
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - run: bash ./scripts/build_macos.sh
      - run: bash ./scripts/test_headless.sh
      - run: bash ./scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pet2-macos-arm64
          path: dist/Pet2-macos-arm64.zip
