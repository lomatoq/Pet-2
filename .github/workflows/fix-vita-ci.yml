name: materialize-vita-source

on:
  push:
    branches:
      - codex/pet2-vita-embodied-iteration

permissions:
  contents: write

concurrency:
  group: materialize-vita-source
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[vita-materialized]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pet2-vita-embodied-iteration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply idempotent source changes
        shell: pwsh
        run: |
          python .github/scripts/fix_vita_ci.py
          python .github/scripts/materialize_visual_input.py
          python .github/scripts/finish_visual_input.py
          cargo fmt --all
      - name: Commit materialized source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            crates/pet_perception/src/lib.rs `
            crates/lifecore/src/actions.rs `
            crates/lifecore/src/vita.rs `
            crates/pet_body/src/embodiment.rs `
            crates/pet_body/src/mesh.rs `
            crates/desktop_host/Cargo.toml `
            crates/desktop_host/src/contract.rs `
            crates/desktop_host/src/sensors.rs `
            crates/desktop_host/src/platform/windows.rs `
            crates/desktop_host/tests/portable_fixture.rs `
            app/src/vita_runtime.rs `
            app/src/main.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: materialize VITA visual perception [vita-materialized]"
            git push origin HEAD:codex/pet2-vita-embodied-iteration
          }
