[package]
name = "pet2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["living-language"]
living-language = []
legacy-expression-fallback = []

[dependencies]
desktop_host = { path = "../crates/desktop_host" }
glam.workspace = true
lifecore = { path = "../crates/lifecore" }
morph_brain = { path = "../crates/morph_brain" }
pet_audio = { path = "../crates/pet_audio" }
pet_body = { path = "../crates/pet_body" }
pet_ecology = { path = "../crates/pet_ecology" }
pet_perception = { path = "../crates/pet_perception" }
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
