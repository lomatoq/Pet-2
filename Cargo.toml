[workspace]
members = ["app", "crates/desktop_host", "crates/lifecore", "crates/morph_brain", "crates/pet_audio", "crates/pet_body", "crates/pet_ecology", "crates/pet_motor", "crates/pet_perception", "tools/body_lab", "tools/habitat_lab", "tools/voice_lab"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/lomatoq/Pet-2"

[workspace.dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
cpal = "=0.15.3"
directories = "=6.0.0"
egui = "=0.33.3"
egui-wgpu = { version = "=0.33.3", default-features = false }
egui-winit = { version = "=0.33.3", default-features = false }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
naga = { version = "27", features = ["wgsl-in"] }
pollster = "0.4"
rand = "0.9"
rand_chacha = { version = "=0.9.0", features = ["serde"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
wgpu = { version = "=27.0.1", default-features = false, features = ["dx12", "metal", "wgsl"] }
wgpu-types = "=27.0.1"
winit = "=0.30.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
